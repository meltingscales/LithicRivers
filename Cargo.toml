[workspace]
members = [
    "crates/core",
    "crates/core",
    "crates/client",
    "crates/app"
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["HenryFBP <henryfbp@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core
hecs = "0.10"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_json = "1"
indexmap = "2"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.7"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI

# CLI
clap = { version = "4", features = ["derive"] }
