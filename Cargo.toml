[workspace]
members = [
    "crates/core",
    "crates/client",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["HenryFBP <henryfbp@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core
hecs = "0.10"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_json = "1"
indexmap = "2"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Speed up debug builds for Bevy/ECS-heavy workloads while keeping incremental builds fast
[profile.dev]
opt-level = 1
debug = true
lto = false
codegen-units = 256
overflow-checks = false

# Build dependencies in dev at higher optimization for better runtime perf
[profile.dev.package."*"]
opt-level = 3
