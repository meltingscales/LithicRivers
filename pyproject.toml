[project]
name = "LithicRivers"
version = "0.1.0"
description = "Flowing stone!"
authors = [
    {name = "Henry Post", email = "HenryFBP@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "asciimatics>=1.15.0",
    "pydevd[dev]>=3.3.0",
    "steam[client]",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "macholib; sys_platform == 'darwin'",
    "coverage",
    "lcov",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
    "pre-commit",
    "pydevd",
    "py-spy",
    "bandit[toml]",
    "safety",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) codes by default.
select = ["E", "F", "I", "W", "B", "C4", "UP", "N", "ARG", "SIM", "TCH", "Q", "RUF"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.9
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "E501",  # line too long, handled by formatter
    "E203",  # whitespace before ':', handled by formatter
    "C901",  # too complex
    "B008",  # do not perform function calls in argument defaults
    "B006",  # do not use mutable data structures for argument defaults
    "ARG002",  # unused method arguments
    "ARG001",  # unused function arguments
    "RUF001",  # unused imports
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["lithicrivers/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=lithicrivers",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=lcov",
]

[dependency-groups]
dev = [
    "py-spy>=0.4.1",
]

[tool.bandit]
exclude_dirs = ["tests", "test", "lithicrivers/test"]
skips = ["B101", "B601"]  # Skip assert_used and hardcoded_password
targets = ["lithicrivers"]
