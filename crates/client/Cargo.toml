[package]
name = "lithicrivers-client"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { workspace = true }
lithicrivers-core = { path = "../core" }
hecs = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
rodio = "0.17"
cpal = "0.15"
# Only embed assets in release mode
rust-embed = { version = "8" }
# Always embed assets; disable default 'debug-embed' feature which reads from filesystem in debug
# rust-embed = { version = "8", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
heck = "0.5.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []