[package]
name = "lithicrivers-client"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.12.1", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { workspace = true }
lithicrivers-core = { path = "../core" }
rand = "0.8"
rand_chacha = "0.3"
ab_glyph = "0.2"

[features]
default = []
# Enable Bevy's built-in Tracy integration when building with `--features tracy`.
# This requires the Tracy viewer to be running to connect.
tracy = ["bevy/trace", "bevy/trace_tracy"]