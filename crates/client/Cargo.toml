[package]
name = "lithicrivers-client"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { workspace = true }
lithicrivers-core = { path = "../core" }
rand = "0.8"
rand_chacha = "0.3"
rodio = "0.17"
cpal = "0.15"
rust-embed = "8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = []