[package]
name = "lithicrivers-client"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { workspace = true }
lithicrivers-core = { path = "../core" }
hecs = { workspace = true }
rand = "0.8"
rand_chacha = "0.3"
rodio = "0.17"
cpal = "0.15"
# Only embed assets in release mode
rust-embed = { version = "8" }
# Always embed assets; disable default 'debug-embed' feature which reads from filesystem in debug
# rust-embed = { version = "8", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
heck = "0.5.0"
unicode-width = "0.1"
strum = { version = "0.25", features = ["derive"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.54.0", features = ["rt", "macros", "io-std", "sync"] }
schemars = "1.2.3"

[dev-dependencies]
lithicrivers-core = { path = "../core", features = ["test-support"] }
insta = { version = "1", features = ["filters", "glob"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
