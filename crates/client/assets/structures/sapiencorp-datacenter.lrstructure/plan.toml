# The SapienCorp datacenter, the third quest's goal: a dark concrete block in the Ruined
# City. The entrance hall holds a dormant transit station and its guards; a cold burner
# generator in the west room powers the sealed door to the server hall, where the data
# shard waits in a quest chest. The generator's network is kept apart from the station's
# RTG, so only fuel opens the door.
# Compiled into shape_layers.txt by `just util-structure-build`; edit this, not that.
