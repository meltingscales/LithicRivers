# Thale's Annex, the fourth quest's goal: a SapienCorp access hut on the surface over a
# twelve-layer stair shaft, down to Thale's reactor annex under a river of fire in the
# deep. A lava channel with one crust ford crosses the arrival hall. The outer reactor room
# holds the casing, waste, iron and electronics for one thermoelectric generator, and the
# blast door to Thale's lab sits on a network with a pole and no generator. The Annex
# Station's RTG is kept more than a wire's reach from that pole, so it can't open the door.
# Compiled into shape_layers.txt by `just util-structure-build`; edit this, not that.
layers = 13
width = 24
height = 18

[legend]
"#" = "concrete"
"r" = "rock"
" " = "air"
"." = "existing_worldgen"
"D" = "door"
">" = "stairs"
"L" = "lava"
"F" = "lava_crust"
