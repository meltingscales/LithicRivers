# The SapienCorp Foundry, the fifth quest's goal: where the aperture's ring was cast. Its
# entrance yard is guarded; its casting hall is cut across by a molten casting pit, five
# tiles of lava wall to wall, with rock heaps on the near side to bridge it from (a plain
# block placed on lava leaves walkable crust). Beyond the pit, the pattern vault holds the
# aperture's casting patterns in a quest chest. No transit station: the walk out is the
# last journey.
# Compiled into shape_layers.txt by `just util-structure-build`; edit this, not that.
layers = 1
width = 30
height = 20

[legend]
"#" = "concrete"
" " = "air"
"." = "existing_worldgen"
"L" = "lava"
"r" = "rock"
"4" = "treasure_quest_4"
"T" = "treasure_rare"
"S" = "scrap_rare"
"s" = "scrap_common"
"X" = "iron_scrap"
"A" = "android_spawn"
"E" = "enemy_spawn"

