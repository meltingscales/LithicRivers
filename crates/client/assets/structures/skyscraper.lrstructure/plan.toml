# A gutted SapienCorp-era office tower in the Ruined City: four floors of concrete joined
# by stairs, with rubble where the floors above came down, scrap in the offices, and an
# old security android still walking the top floor.
# Compiled into shape_layers.txt by `just util-structure-build`; edit this, not that.
layers = 4
width = 12
height = 12

[legend]
"#" = "concrete"
" " = "air"
"." = "existing_worldgen"
"D" = "door"
">" = "stairs"
"R" = "rubble"
"s" = "scrap_common"
"S" = "scrap_rare"
"t" = "treasure_common"
"T" = "treasure_rare"
"E" = "enemy_spawn"
"A" = "android_spawn"

