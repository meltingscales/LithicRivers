# A SapienCorp dig site in the Lithic Rivers: a brick site office and a riverglass store
# joined by a short hall, the office's east wall caved in, and the drill's last bore hole
# cut out to the west. Placed by the deep band's biome structures.
# Compiled into shape_layers.txt by `just util-structure-build`; edit this, not that.
layers = 1
width = 17
height = 9
background = "."

[legend]
"." = "existing_worldgen"
" " = "air"
"B" = "stone_brick"
"D" = "door"
"G" = "riverglass"
"X" = "iron_scrap"
"E" = "scrap_electronics"
"s" = "scrap_common"
"S" = "scrap_rare"
"T" = "treasure_rare"
"I" = "power_pole"

# The bore hole: a straight cut west, where the drill stopped
[[shape]]
kind = "corridor"
layer = 0
from = [0, 4]
to = [3, 4]

# The site office
[[shape]]
kind = "room"
layer = 0
x = 3
y = 1
w = 6
h = 7
wall = "B"
doors = [[3, 4], [8, 4]]

