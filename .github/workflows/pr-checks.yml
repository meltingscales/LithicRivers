---
name: "PR checks"

# Tests and lint on every pull request into release, on all three release platforms.
# The release workflow (release.yml) only runs on version tags.
#
# Also runs on pushes to release: PRs can only read caches saved on their base branch,
# so this is what gives every PR a warm build cache.
on:
  pull_request:
    branches: [release]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openspec/**"
  push:
    branches: [release]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "openspec/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  # Never cancel a release run: it saves the cache every PR uses
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: 0
      # No debug info in CI: faster linking and a smaller cache
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # rust-toolchain.toml pins nightly with rustfmt and clippy
      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install audio build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      # PRs restore the cache saved by the latest release run; only release runs save it
      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-checks-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/release' }}

      # Same as `just code-clippy`. Lint results don't depend on the OS, so Linux only
      - name: Clippy (warnings are errors)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Includes the headless script tests and UI snapshot tests (scripts/snapshots)
      - name: Tests
        run: cargo test --workspace
