---
name: "PR checks"

# Tests and lint on every pull request into release, on all three release platforms.
# The release workflow (ci.yml) only runs on version tags.
on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins nightly with rustfmt and clippy
      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install audio build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: pr-checks-${{ runner.os }}

      # Same as `just code-clippy`
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Includes the headless script tests and UI snapshot tests (scripts/snapshots)
      - name: Tests
        run: cargo test --workspace
