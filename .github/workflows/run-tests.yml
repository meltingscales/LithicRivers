---
name: "run-tests"

on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@v2.4.0"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v1"
        with:
          version: "latest"

      - run: "make install"
      - run: "make test-lcov"
      - run: "make test-tui"

      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}