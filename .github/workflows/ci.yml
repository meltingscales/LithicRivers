---
name: "Simplified CI/CD"

on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build on Windows
        run: just --justfile justfile.windows build

      - name: Build on Linux
        run: just build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/**

  steam-upload:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release' && vars.ENABLE_STEAM_UPLOAD == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install steamcmd
        run: sudo apt-get update && sudo apt-get install -y steamcmd

      - name: Upload to Steam (SteamPipe)
        if: ${{ secrets.STEAM_USERNAME && secrets.STEAM_PASSWORD && secrets.STEAM_APP_ID }}
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
        run: |
          steamcmd +login "$STEAM_USERNAME" "$STEAM_PASSWORD" \
                   +run_app_build_http scripts/app_build.vdf \
                   +quit