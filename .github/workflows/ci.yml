---
name: "Simplified CI/CD"

on:
  push:
    branches:
      - release
      - rust-migration #enabled just for testing

jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/rust-migration'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install just
          just --justfile justfile.windows build

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt install just
          just build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: target/**

  steam-upload-ubuntu:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/rust-migration' && vars.ENABLE_STEAM_UPLOAD == 'true'
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install steamcmd
        run: sudo apt-get update && sudo apt-get install -y steamcmd

      - name: Upload to Steam (SteamPipe)
        if: env.STEAM_USERNAME != ''
        run: |
          steamcmd +login "$STEAM_USERNAME" "$STEAM_PASSWORD" \
                   +run_app_build_http scripts/app_build.vdf \
                   +quit