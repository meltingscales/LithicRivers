---
name: "Simplified CI/CD"

on:
  push:
    tags:
      - "v*" # e.g. v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 5G
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for versioning

      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install sccache (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache

      - name: Install sccache (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install sccache

      - name: Install sccache (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/Library/Caches/Mozilla.sccache
            ~/Library/Caches/sccache
            C:\\Users\\runneradmin\\AppData\\Local\\Mozilla\\sccache
            C:\\Users\\runneradmin\\AppData\\Local\\sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ runner.os }}-nightly-${{ hashFiles('**/Cargo.lock') }}
          shared-key: ${{ runner.os }}-nightly-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install just
          just --justfile justfile.windows build-release
          just --justfile justfile.windows stage-artifacts-release

      - name: Zip artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\* -DestinationPath artifacts\lithicrivers-windows.zip -Force

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install just
          sudo bash scripts/install_dev_deps.sh
          just build-release
          just stage-artifacts-release

      - name: Zip artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          (cd artifacts && zip -r lithicrivers-ubuntu.zip .)

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install just
          just build-release
          just stage-artifacts-release

      - name: Zip artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          (cd artifacts && zip -r lithicrivers-macos.zip .)

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/lithicrivers-windows.zip

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/lithicrivers-ubuntu.zip

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/lithicrivers-macos.zip

  steam-upload-ubuntu:
    name: Upload to Steam for Ubuntu (SteamPipe)
    continue-on-error: true
    needs: build
    runs-on: ubuntu-latest
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
      STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-ubuntu-latest
          path: artifacts

      - name: Unzip Ubuntu artifacts for steam
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o artifacts/lithicrivers-ubuntu.zip -d artifacts

      - name: Install steamcmd
        run: |
          sudo add-apt-repository multiverse
          sudo dpkg --add-architecture i386
          sudo apt update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo apt-get install -y steamcmd

      - name: Setup steamcmd credentials
        run: |
          # populate ~/.local/share/Steam/config/config.vdf with our secret value
          mkdir -p ~/.local/share/Steam/config
          echo "$STEAM_CONFIG_VDF" > ~/.local/share/Steam/config/config.vdf
          ls -lash ~/.local/share/Steam/config/config.vdf

      - name: Test steamcmd login and print info
        run: |
          steamcmd +login "$STEAM_USERNAME" +info +quit

      - name: Upload to Steam for Ubuntu (SteamPipe)
        run: |
          APPVDF="$(realpath app_build_linux.vdf)"
          
          # this uploads the app
          steamcmd +login "$STEAM_USERNAME" +run_app_build_http $APPVDF +quit

  steam-upload-windows:
    name: Upload to Steam for Windows (SteamPipe)
    continue-on-error: true
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-windows-latest
          path: artifacts

      - name: Unzip Windows artifacts for steam
        run: |
          Compress-Archive -Path artifacts\* -DestinationPath artifacts\lithicrivers-windows.zip -Force

      - name: Install steamcmd
        run: |
          choco install steamcmd

      - name: Setup steamcmd credentials
        run: |
          # populate config.vdf with our secret value
          $configPath = "C:\ProgramData\chocolatey\lib\steamcmd\tools\config"
          New-Item -ItemType Directory -Force -Path $configPath | Out-Null
          $env:STEAM_CONFIG_VDF | Out-File -FilePath "$configPath\config.vdf" -Encoding ascii
          Get-ChildItem -Path $configPath\config.vdf

      - name: Test steamcmd login and print info
        run: |
          steamcmd +login "$STEAM_USERNAME" +info +quit

      - name: Upload to Steam for Windows (SteamPipe)
        shell: pwsh
        run: |
          $APPVDF = (Resolve-Path "app_build_windows.vdf").Path

          # this uploads the app
          steamcmd +login $env:STEAM_USERNAME +run_app_build_http $APPVDF +quit

  steam-upload-macos:
    name: Upload to Steam for macOS (SteamPipe)
    continue-on-error: true
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-macos-latest
          path: artifacts

      - name: Unzip macOS artifacts for steam
        run: |
          ditto -xk artifacts/lithicrivers-macos.zip artifacts/

      - name: Install steamcmd
        run: |
          brew install steamcmd

      - name: Setup steamcmd credentials
        run: |
          mkdir -p ~/.local/share/Steam/config
          echo "$STEAM_CONFIG_VDF" > ~/.local/share/Steam/config/config.vdf
          ls -lash ~/.local/share/Steam/config/config.vdf

      - name: Test steamcmd login and print info
        run: |
          steamcmd +login "$STEAM_USERNAME" +info +quit

      - name: Upload to Steam for macOS (SteamPipe)
        run: |
          APPVDF="$(realpath app_build_macos.vdf)"
          
          # this uploads the app
          steamcmd +login "$STEAM_USERNAME" +run_app_build_http $APPVDF +quit

  github-release-ubuntu:
    name: Create GitHub Release (Ubuntu)
    continue-on-error: true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-ubuntu-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LithicRivers Multiplatform ${{ github.ref_name }}
          body: |
            Version: ${{ github.ref_name }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/lithicrivers-ubuntu.zip
            CHANGELOG.txt

  github-release-windows:
    name: Create GitHub Release (Windows)
    continue-on-error: true
    needs: [build, github-release-ubuntu]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-windows-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LithicRivers Multiplatform ${{ github.ref_name }}
          body: |
            Version: ${{ github.ref_name }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/lithicrivers-windows.zip

  github-release-macos:
    name: Create GitHub Release (macOS)
    continue-on-error: true
    needs: [build, github-release-ubuntu]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-macos-latest
          path: artifacts

      - name: Upload to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LithicRivers Multiplatform ${{ github.ref_name }}
          body: |
            Version: ${{ github.ref_name }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/lithicrivers-macos.zip
