---
name: "Simplified CI/CD"

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 5G
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install sccache (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache

      - name: Install sccache (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install sccache

      - name: Install sccache (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/Library/Caches/Mozilla.sccache
            ~/Library/Caches/sccache
            C:\\Users\\runneradmin\\AppData\\Local\\Mozilla\\sccache
            C:\\Users\\runneradmin\\AppData\\Local\\sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ runner.os }}-nightly

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install just
          just --justfile justfile.windows build
          just --justfile justfile.windows stage-artifacts

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install just
          sudo bash scripts/install_dev_deps.sh
          just build
          just stage-artifacts

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install just
          just build
          just stage-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/

  steam-upload-ubuntu:
    needs: build
    runs-on: ubuntu-latest
    if: vars.ENABLE_STEAM_UPLOAD == 'true'
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-ubuntu-latest
          path: artifacts

      - name: Install steamcmd
        run: sudo apt-get update && sudo apt-get install -y steamcmd

      - name: Upload to Steam (SteamPipe)
        if: env.STEAM_USERNAME != ''
        run: |
          APPVDF="$(realpath scripts/app_build_linux.vdf)"
          steamcmd +login "$STEAM_USERNAME" "$STEAM_PASSWORD" \
                   +run_app_build_http $APPVDF \
                   +quit

  github-release-ubuntu:
    name: Create GitHub Release (Ubuntu)
    continue-on-error: true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-ubuntu-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-ubuntu-latest-${{ github.ref_name }}-${{ github.sha }}
          name: LithicRivers Ubuntu ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Automated release for branch ${{ github.ref_name }} at commit ${{ github.sha }}.
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*

  github-release-windows:
    name: Create GitHub Release (Windows)
    continue-on-error: true
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-windows-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-windows-latest-${{ github.ref_name }}-${{ github.sha }}
          name: LithicRivers Windows ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Automated release for branch ${{ github.ref_name }} at commit ${{ github.sha }}.
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*

  github-release-macos:
    name: Create GitHub Release (macOS)
    continue-on-error: true
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-macos-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-macos-latest-${{ github.ref_name }}-${{ github.sha }}
          name: LithicRivers macOS ${{ github.ref_name }} (${{ github.sha }})
          body: |
            Automated release for branch ${{ github.ref_name }} at commit ${{ github.sha }}.
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*