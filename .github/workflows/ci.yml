---
name: "Simplified CI/CD"

on:
  push:
    branches:
      - release
    tags:
      - "v*" # e.g. v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 5G
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for versioning

      - name: Compute VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
            if [[ -n "$last_tag" ]]; then
              ver="${last_tag#v}-dev.${short_sha}"
            else
              ver="0.0.0-dev.${short_sha}"
            fi
          fi
          printf "%s" "$ver" > VERSION
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install sccache (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache

      - name: Install sccache (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install sccache

      - name: Install sccache (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/Library/Caches/Mozilla.sccache
            ~/Library/Caches/sccache
            C:\\Users\\runneradmin\\AppData\\Local\\Mozilla\\sccache
            C:\\Users\\runneradmin\\AppData\\Local\\sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ runner.os }}-nightly

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install just
          just --justfile justfile.windows build-release
          just --justfile justfile.windows stage-artifacts-release

      - name: Build on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install just
          sudo bash scripts/install_dev_deps.sh
          just build-release
          just stage-artifacts-release

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install just
          just build-release
          just stage-artifacts-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/

  steam-upload-ubuntu:
    needs: build
    runs-on: ubuntu-latest
    if: vars.ENABLE_STEAM_UPLOAD == 'true'
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-ubuntu-latest
          path: artifacts

      - name: Install steamcmd
        run: sudo apt-get update && sudo apt-get install -y steamcmd

      - name: Upload to Steam (SteamPipe)
        if: env.STEAM_USERNAME != ''
        run: |
          APPVDF="$(realpath scripts/app_build_linux.vdf)"
          steamcmd +login "$STEAM_USERNAME" "$STEAM_PASSWORD" \
                   +run_app_build_http $APPVDF \
                   +quit

  github-release-ubuntu:
    name: Create GitHub Release (Ubuntu)
    continue-on-error: true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
            if [[ -n "$last_tag" ]]; then
              ver="${last_tag#v}-dev.${short_sha}"
            else
              ver="0.0.0-dev.${short_sha}"
            fi
          fi
          printf "%s" "$ver" > VERSION
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-ubuntu-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('release-ubuntu-{0}', steps.ver.outputs.version) }}
          name: LithicRivers Ubuntu ${{ steps.ver.outputs.version }}
          body: |
            Version: ${{ steps.ver.outputs.version }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*
            CHANGELOG.txt

  github-release-windows:
    name: Create GitHub Release (Windows)
    continue-on-error: true
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute VERSION
        id: ver
        shell: pwsh
        run: |
          $isTag = "$env:GITHUB_REF_TYPE" -eq "tag" -and $env:GITHUB_REF_NAME.StartsWith('v')
          if ($isTag) {
            $ver = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $lastTag = (git describe --tags --abbrev=0 2>$null) | Out-String
            $lastTag = $lastTag.Trim()
            $shortSha = $env:GITHUB_SHA.Substring(0,7)
            if ($lastTag) { $ver = ($lastTag.TrimStart('v')) + "-dev." + $shortSha } else { $ver = "0.0.0-dev." + $shortSha }
          }
          Set-Content -NoNewline -Path VERSION -Value $ver
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-windows-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('release-windows-{0}', steps.ver.outputs.version) }}
          name: LithicRivers Windows ${{ steps.ver.outputs.version }}
          body: |
            Version: ${{ steps.ver.outputs.version }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*
            CHANGELOG.txt

  github-release-macos:
    name: Create GitHub Release (macOS)
    continue-on-error: true
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
            if [[ -n "$last_tag" ]]; then
              ver="${last_tag#v}-dev.${short_sha}"
            else
              ver="0.0.0-dev.${short_sha}"
            fi
          fi
          printf "%s" "$ver" > VERSION
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lithicrivers-${{ github.ref_name }}-${{ github.sha }}-macos-latest
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('release-macos-{0}', steps.ver.outputs.version) }}
          name: LithicRivers macOS ${{ steps.ver.outputs.version }}
          body: |
            Version: ${{ steps.ver.outputs.version }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            This release was generated by CI after a successful build.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*
            CHANGELOG.txt